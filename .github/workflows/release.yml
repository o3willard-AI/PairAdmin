name: release

on:
  push:
    tags:
      - "v*"

# Cancel a superseded release run if a newer tag is pushed while one is mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Marks every release-pipeline binary as a "release build" (see
  # services/config/config.go's isReleaseBuild) so it stores its config,
  # known_hosts, keyring fallback, and audit logs under the OS-conventional
  # per-user data directory instead of the legacy ~/.pairadmin a local dev
  # `wails build`/`wails dev` still uses — otherwise a QA session's dev
  # binary and the properly-installed release binary silently share the
  # exact same storage, and QA data leaks into what should be a fresh install.
  RELEASE_LDFLAGS: "-X pairadmin/services/config.releaseBuild=true"

jobs:
  # Gate every build on the pushed tag matching wails.json's productVersion, so
  # a release can't silently ship a binary that reports a different version.
  verify-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4
      - name: Check tag matches wails.json productVersion
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./wails.json').productVersion")"
          echo "pushed tag: ${GITHUB_REF_NAME} | wails.json productVersion: ${declared}"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' does not match wails.json productVersion '${declared}'. Bump wails.json to match the tag before releasing." >&2
            exit 1
          fi

  build-linux:
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read # build job only reads source and uploads an artifact (no repo writes)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # tag: v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # tag: v4
        with:
          node-version: "20"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            gcc \
            at-spi2-core

      - name: Install Wails CLI (pinned to go.mod version)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build binary
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -platform linux/amd64 -tags webkit2_41 -ldflags "$RELEASE_LDFLAGS"

      - name: Package .deb and .rpm (nfpm)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Pin nfpm to a specific release (never a floating tag) so packaging output is reproducible.
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          export VERSION="${GITHUB_REF_NAME#v}"
          nfpm package --packager deb
          nfpm package --packager rpm
          # rename to the canonical install.sh/README convention
          mv pairadmin_*_amd64.deb "pairadmin_${VERSION}_linux_amd64.deb"
          mv pairadmin-*.x86_64.rpm "pairadmin_${VERSION}_linux_amd64.rpm"
          mkdir -p dist
          mv *.deb *.rpm dist/
          ls -la dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag: v4.6.2
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # tag: v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # tag: v4
        with:
          node-version: "20"

      - name: Install Wails CLI (pinned to go.mod version)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS (makensis)
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $bin = "C:\Program Files (x86)\NSIS\Bin"
          if (Test-Path $bin) { Add-Content $env:GITHUB_PATH $bin }
          else { Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS" }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $env:PATH = "$(go env GOPATH)\bin;$env:PATH"
          wails build -platform windows/amd64 --nsis -ldflags "$env:RELEASE_LDFLAGS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag: v4.6.2
        with:
          name: windows
          path: build/bin/*-installer.exe
          if-no-files-found: error

  build-macos:
    needs: verify-version
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # tag: v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # tag: v4
        with:
          node-version: "20"

      - name: Install Wails CLI (pinned to go.mod version)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Free disk space (macOS runners are tight; hdiutil needs headroom)
        run: |
          df -h /
          brew cleanup --prune=all 2>/dev/null || true
          rm -rf "$(brew --cache)" 2>/dev/null || true
          rm -rf ~/Library/Caches/Homebrew ~/Library/Caches/pip 2>/dev/null || true
          df -h /

      - name: Build .app (unsigned)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -platform darwin/universal -ldflags "$RELEASE_LDFLAGS"

      - name: Package .dmg (unsigned)
        run: |
          cd build/bin
          APP="$(find . -maxdepth 1 -name '*.app' | head -1)"
          echo "Packaging $APP"
          hdiutil create -volname "PairAdmin" -srcfolder "$APP" -ov -format UDZO "PairAdmin-${GITHUB_REF_NAME}.dmg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag: v4.6.2
        with:
          name: macos
          path: build/bin/*.dmg
          if-no-files-found: error

  release:
    needs: [verify-version, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the ONLY job that writes: it creates the GitHub Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # tag: v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          for f in *.deb *.rpm *.exe *.dmg; do [ -f "$f" ] && sha256sum "$f"; done > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # tag: v2.6.2
        with:
          files: dist/*
          generate_release_notes: true